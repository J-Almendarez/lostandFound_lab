<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign in - Campus Lost &amp; Found</title>
  <style>
    body    { font-family: Arial, sans-serif; margin: 24px; }
    h1      { color: green; }
    .error  { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Sign in</h1>

  <p class="success" th:if="${param.registered}">Account created! You can sign in now.</p>
  <p class="error" th:if="${param.error}">Wrong username or password.</p>
  <p class="success" th:if="${param.logout}">You have been signed out.</p>

  <!-- Spring Security handles the POST to /login for us -->
  <form th:action="@{/login}" method="post">
    <p>
      <label for="username">Username</label><br>
      <input type="text" id="username" name="username">
    </p>
    <p>
      <label for="password">Password</label><br>
      <input type="password" id="password" name="password">
    </p>
    <button type="submit">Sign in</button>
  </form>

  <p>Don't have an account? <a th:href="@{/register}">Register</a></p>
</body>
</html>
