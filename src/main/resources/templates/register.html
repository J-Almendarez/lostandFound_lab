<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Register - Campus Lost &amp; Found</title>
  <style>
    body  { font-family: Arial, sans-serif; margin: 24px; }
    h1    { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>Create an account</h1>

  <!-- only shows up when the controller sends an error -->
  <p class="error" th:if="${error}" th:text="${error}"></p>

  <form th:action="@{/register}" method="post">
    <p>
      <label for="username">Username</label><br>
      <input type="text" id="username" name="username" th:value="${username}">
    </p>
    <p>
      <label for="password">Password</label><br>
      <input type="password" id="password" name="password">
    </p>
    <button type="submit">Register</button>
  </form>

  <p>Already have an account? <a th:href="@{/login}">Sign in</a></p>
</body>
</html>
